<section class="engagement-section"><h3 class="engagement-title">🔔 Price Alerts</h3><div id="alerts-container" class="alerts-container"></div>
<div class="alert-form"><h4>Set New Alert</h4><form id="alertForm" class="alert-form-inline"><input type="text" id="alertAsset" placeholder="Asset (e.g., NMB)" required><select id="alertCondition" required><option value="above">Above</option><option value="below">Below</option></select><input type="number" id="alertValue" placeholder="Price (TZS)" required><button type="submit" class="btn btn-primary">Set Alert</button></form></div></section>
