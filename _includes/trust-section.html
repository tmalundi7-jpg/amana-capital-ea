<section class="trust-section" aria-labelledby="trust-heading">
  <div class="container">
    <h2 id="trust-heading" class="trust-title">
      <span class="trust-title-accent">Trusted By</span>
      <span class="trust-title-text">Leading Investors & Institutions</span>
    </h2>
    <div class="trust-grid">
      <div class="trust-item trust-media">
        <span class="trust-item-label">As featured in</span>
        <div class="trust-logos">
          <span class="trust-logo-placeholder">The Citizen</span>
          <span class="trust-logo-placeholder">The Guardian</span>
          <span class="trust-logo-placeholder">Business Times</span>
        </div>
      </div>
      <div class="trust-item trust-awards">
        <span class="trust-item-label">Awards</span>
        <div class="trust-badges">
          <span class="trust-badge">🏆 Best Investment Firm 2025</span>
          <span class="trust-badge">⭐ Top 10 DSE Brokers</span>
        </div>
      </div>
      <div class="trust-item trust-clients">
        <span class="trust-item-label">Our Clients</span>
        <div class="trust-clients-grid">
          <span class="client-placeholder">Client A</span>
          <span class="client-placeholder">Client B</span>
          <span class="client-placeholder">Client C</span>
          <span class="client-placeholder">Client D</span>
        </div>
      </div>
    </div>
    <div class="trust-regulatory">
      <span class="regulatory-badge">
        <span class="regulatory-icon">✓</span>
        <span class="regulatory-text">Licensed by the Capital Markets and Securities Authority (CMSA) of Tanzania</span>
      </span>
    </div>
  </div>
</section>
