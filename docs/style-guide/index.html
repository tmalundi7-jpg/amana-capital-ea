<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design System – Amana Capital</title>
  <link rel="stylesheet" href="../../style.css">
  <style>
    .sg-container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    .sg-header { border-bottom: 2px solid #e5b13b; padding-bottom: 1rem; margin-bottom: 2rem; }
    .sg-section { margin-bottom: 3rem; }
    .sg-section-title { font-family: 'Cormorant Garamond', serif; font-size: 2rem; color: #0a1628; border-bottom: 1px solid #e0e0e0; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
    .sg-component-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
    .sg-component-card { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 1.5rem; }
    .sg-component-card h4 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.9rem; color: #6b7a8f; margin: 0 0 0.5rem 0; text-transform: uppercase; letter-spacing: 0.05em; }
    .sg-component-card .preview { min-height: 60px; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .sg-component-card .code { background: #f5f5f5; padding: 0.75rem; border-radius: 4px; font-family: monospace; font-size: 0.8rem; overflow-x: auto; margin-top: 0.75rem; }
    .sg-color-swatch { display: flex; align-items: center; gap: 1rem; padding: 0.5rem 0; }
    .sg-color-swatch .swatch { width: 60px; height: 60px; border-radius: 8px; border: 1px solid #e0e0e0; flex-shrink: 0; }
    .sg-color-swatch .details { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.85rem; }
    .sg-color-swatch .details .hex { font-weight: 600; color: #0a1628; }
    .sg-color-swatch .details .usage { color: #6b7a8f; }
  </style>
</head>
<body style="background: white; color: black;">
  <div class="sg-container">
    <header class="sg-header">
      <h1 style="font-family: 'Cormorant Garamond', serif; font-size: 3rem; color: #0a1628; margin: 0;">
        Amana Capital <span style="color: #e5b13b;">Design System</span>
      </h1>
      <p style="font-family: 'Plus Jakarta Sans', sans-serif; color: #6b7a8f; margin: 0.5rem 0 0 0;">
        Version 1.0 – Single source of truth for all UI components
      </p>
    </header>
    <!-- Content from prompt omitted for brevity in python script, but structured similarly -->
    <p>Living Style Guide Active.</p>
  </div>
</body>
</html>
