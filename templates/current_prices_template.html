<!-- PRICES_TABLE_START -->
<!-- Terminal design, Oct 2026. Rendered by generate_daily_update.py between the
     PRICES_TABLE_START/END markers in current-prices.html. `equities` is the
     enriched list built by the script (ticker/close/change_pct/volume/turnover). -->
<div class="term-tbl-wrap"><table class="term-table data-table">
<thead><tr><th>Ticker</th><th class="r">Last (TZS)</th><th class="r">Chg %</th><th class="r">Volume</th><th class="r">Turnover</th></tr></thead>
<tbody>
{% for eq in equities %}
<tr><td class="term-sym">{{ eq.ticker }}</td><td class="r">{{ "{:,.0f}".format(eq.close) }}</td><td class="r"><span class="{{ 'term-up' if eq.change_pct > 0 else ('term-down' if eq.change_pct < 0 else 'term-flat') }}">{{ ('+' if eq.change_pct > 0 else '') + "%.1f"|format(eq.change_pct) }}%</span></td><td class="r">{{ "{:,}".format(eq.volume|int) }}</td><td class="r">{{ eq.turnover_compact }}</td></tr>
{% endfor %}
</tbody>
</table></div>
<!-- PRICES_TABLE_END -->
